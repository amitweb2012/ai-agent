[project]
name = "ai-agent"
version = "1.0.0"
description = "Learning-to-production AI Agent examples with tool calling, local RAG, Ollama, and MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.0,<3.0",
  "numpy>=2.0,<3.0",
  "openai>=1.0,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
ai-basic = "ai_agent.basic.ai_assistant:main"
ai-rag = "ai_agent.rag.rag:main"
ai-mcp-server = "ai_agent.mcp.server:main"
ai-mcp-agent = "ai_agent.mcp.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
